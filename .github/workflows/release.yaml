name: Signed Release APKs

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: signed-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release:
    name: Build and sign phone and TV
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up JDK 21
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6
        with:
          java-version: 21
          distribution: temurin

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6

      - name: Read Android SDK versions
        id: sdk
        run: |
          python3 - <<'PY'
          import os
          import re
          from pathlib import Path

          versions = Path("buildSrc/src/main/kotlin/Versions.kt").read_text()
          sdk = re.search(r"const val COMPILE_SDK = (\d+)", versions).group(1)
          tools = re.search(r'const val BUILD_TOOLS = "([\d.]+)"', versions).group(1)
          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              output.write(f"compile_sdk={sdk}\nbuild_tools={tools}\n")
          PY

      - name: Set up Android SDK
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4
        with:
          log-accepted-android-sdk-licenses: false

      - name: Install requested Android SDK packages
        env:
          COMPILE_SDK: ${{ steps.sdk.outputs.compile_sdk }}
          BUILD_TOOLS: ${{ steps.sdk.outputs.build_tools }}
        run: |
          sdkmanager --list | awk -F '|' '{
            gsub(/^[[:space:]]+|[[:space:]]+$/, "", $1)
            print $1
          }' > "$RUNNER_TEMP/android-sdk-packages.txt"
          platform=""
          # Recent SDKs use a decimal platform package ID, such as android-37.0.
          for candidate in "platforms;android-$COMPILE_SDK" "platforms;android-$COMPILE_SDK.0"; do
            if grep -Fxq "$candidate" "$RUNNER_TEMP/android-sdk-packages.txt"; then
              platform="$candidate"
              break
            fi
          done
          if [[ -z "$platform" ]]; then
            echo "No Android platform package found for API $COMPILE_SDK" >&2
            exit 1
          fi
          sdkmanager "$platform" "build-tools;$BUILD_TOOLS"

      - name: Build unsigned release APKs
        run: ./gradlew :app:phone:assembleLibreRelease :app:tv:assembleLibreRelease --console=plain

      - name: Sign and verify all release APKs
        env:
          SIGNING_KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
          SIGNING_CERT_SHA256: ${{ secrets.SIGNING_CERT_SHA256 }}
          BUILD_TOOLS: ${{ steps.sdk.outputs.build_tools }}
        run: |
          set -euo pipefail
          set +x
          umask 077
          export SIGNING_KEYSTORE_PATH="$RUNNER_TEMP/findroid-release-signing.p12"
          trap 'rm -f "$SIGNING_KEYSTORE_PATH"' EXIT
          printf '%s' "${SIGNING_KEYSTORE_BASE64:?Missing signing keystore secret}" \
            | base64 --decode > "$SIGNING_KEYSTORE_PATH"
          unset SIGNING_KEYSTORE_BASE64
          bash .github/scripts/sign-release-apks.sh "$ANDROID_HOME/build-tools/$BUILD_TOOLS/apksigner"

      - name: Remove temporary signing keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/findroid-release-signing.p12"

      - name: Upload signed phone APKs
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: phone-libre-release-signed-${{ github.sha }}
          path: |
            app/phone/build/outputs/apk/libre/release/*-signed.apk
            app/phone/build/outputs/apk/libre/release/*-signed-verification.txt
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

      - name: Upload signed TV APKs
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: tv-libre-release-signed-${{ github.sha }}
          path: |
            app/tv/build/outputs/apk/libre/release/*-signed.apk
            app/tv/build/outputs/apk/libre/release/*-signed-verification.txt
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
